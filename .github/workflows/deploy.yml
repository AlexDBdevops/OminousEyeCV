name: deploy
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
concurrency: deploy-${{ github.ref }}
# Permisos mínimos del GITHUB_TOKEN: solo lectura del código
permissions: { contents: read }
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
  TF_WORKSPACE: ominous-eye-cv
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
  TF_IN_AUTOMATION: "1"
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Acciones fijadas por SHA (v7.0.1, v7.0.0, v4.0.1); Dependabot las mantiene al día
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: { go-version: '1.24', cache: false }
      - name: Format, vet and test
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt: files need formatting"; exit 1; }
          go vet ./...
          go test ./...
      - run: go run .            # genera dist/ con el tema de content/theme.txt
      - name: Comprobar credenciales
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$TF_TOKEN_app_terraform_io" ] || [ -z "$TF_CLOUD_ORGANIZATION" ]; then
            echo "Faltan credenciales de Cloudflare o HCP Terraform: solo se compila." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        if: steps.cf.outputs.ready == 'true'
        with: { terraform_wrapper: false }
      - name: Terraform init + fmt + validate
        if: steps.cf.outputs.ready == 'true'
        run: |
          terraform -chdir=infra init -input=false
          terraform -chdir=infra fmt -check
          terraform -chdir=infra validate
      - name: Terraform plan (pull request)
        if: steps.cf.outputs.ready == 'true' && github.event_name == 'pull_request'
        run: terraform -chdir=infra plan -input=false -lock-timeout=60s
      - name: Terraform apply (main)
        if: steps.cf.outputs.ready == 'true' && github.event_name != 'pull_request'
        run: terraform -chdir=infra apply -input=false -auto-approve -lock-timeout=60s
      - name: Desplegar en Cloudflare Pages
        if: steps.cf.outputs.ready == 'true'
        run: |
          PROJECT=$(terraform -chdir=infra output -raw project_name)
          BRANCH="${{ github.head_ref || github.ref_name }}"
          npx --yes wrangler@3 pages deploy dist --project-name "$PROJECT" --branch "$BRANCH" | tee out.txt
          echo "URL: $(grep -Eo 'https://[^ ]+\.pages\.dev' out.txt | tail -1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Redirect www to the main address (main)
        if: steps.cf.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        run: |
          # www.<project>.pages.dev is treated as a branch alias; deploy a tiny "www" branch that only redirects
          PROJECT=$(terraform -chdir=infra output -raw project_name)
          mkdir -p www
          printf '/ https://%s.pages.dev/ 301\n/* https://%s.pages.dev/:splat 301\n' "$PROJECT" "$PROJECT" > www/_redirects
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=https://%s.pages.dev/"><title>Redirecting</title><a href="https://%s.pages.dev/">%s.pages.dev</a>\n' "$PROJECT" "$PROJECT" "$PROJECT" > www/index.html
          npx --yes wrangler@3 pages deploy www --project-name "$PROJECT" --branch www
