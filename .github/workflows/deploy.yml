name: deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
concurrency: deploy
permissions: { id-token: write, contents: read }
jobs:
  deploy:
    if: ${{ vars.AWS_APPLY_ROLE != '' }}   # no hace nada hasta completar el bootstrap de AWS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - run: go run .                          # genera dist/ con el tema de content/theme.txt
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_wrapper: false }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE }}
          aws-region: eu-west-1
      - run: terraform -chdir=infra init -backend-config="bucket=${{ vars.STATE_BUCKET }}"
      - run: terraform -chdir=infra apply -auto-approve -lock-timeout=60s
      - name: Publicar sitio
        run: |
          BUCKET=$(terraform -chdir=infra output -raw bucket)
          DIST=$(terraform -chdir=infra output -raw distribution)
          aws s3 sync dist/ "s3://$BUCKET/" --delete
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*"
          echo "URL: $(terraform -chdir=infra output -raw url)" >> "$GITHUB_STEP_SUMMARY"
