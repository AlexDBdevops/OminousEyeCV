name: cleanup
# Removes old Cloudflare Pages deployments: at the end of every deploy run (called from deploy.yml),
# when a branch is deleted, or by hand. The preview of every branch that still exists is kept.
on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN: { required: false }
  delete:
  workflow_dispatch:
    inputs:
      dry_run:
        description: List only, do not delete
        type: boolean
        default: false
concurrency: cleanup
permissions: { contents: read }
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Prune stale deployments
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "No Cloudflare credentials: nothing to clean." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          # Project name comes from the Terraform default so there is a single source of truth
          PAGES_PROJECT=$(awk '/variable "project_name"/{f=1} f&&/default/{gsub(/[" ]/,"",$3); print $3; exit}' infra/main.tf)
          # Keep the www redirect and the preview of every branch that still exists in the repo
          BRANCHES=$(gh api "repos/$GITHUB_REPOSITORY/branches" --paginate --jq '.[].name' | tr '\n' ' ')
          export PAGES_PROJECT KEEP_BRANCHES="www $BRANCHES"
          tools/cleanup-deployments.sh | tee -a "$GITHUB_STEP_SUMMARY"
